  - lines: "297-328"
    event: "Буря разделяет корабли Менелая; пока он странствует, Эгисф правит до возвращения Ореста."
    speaker: "Нестор"
    addressee: "Телемах"
    cause_and_effect: "Погребальная задержка и буря надолго удаляют возможного защитника; семилетняя власть Эгисфа заканчивается местью сына."
    formulas_and_epithets:
