segments:
  - lines: "1-24"
    event: "Телемах прибывает в Пилос во время общественного жертвоприношения Посейдону."
    speaker: "повествователь"
    addressee: "слушатель"
    cause_and_effect: "Ночной путь из Итаки приводит юношу прямо к публичному ритуалу, который определяет порядок встречи."
    formulas_and_epithets:
      ["Солнце из моря", "медное небо", "Посейдон, сотрясающий землю"]
    ambiguities:
      [
        "Точный счёт участников создаёт эпический масштаб; его нельзя автоматически принимать как демографический документ.",
      ]
    first_reveals: [telemachus_arrives_pylos, pylian_poseidon_sacrifice]
    reader_questions:
      ["Где находится Пилос?", "Почему быки чёрные?", "Что означает гекатомба?"]
  - lines: "25-62"
    event: "Афина учит Телемаха обратиться к Нестору; Писистрат принимает гостей и передаёт им чашу."
    speaker: "Афина-Ментор, Телемах, Писистрат"
    addressee: "Телемах; гости"
    cause_and_effect: "Стеснение Телемаха преодолевается советом богини, а участие в возлиянии вводит чужеземцев в общину пирующих."
    formulas_and_epithets:
      ["сероглазая Афина", "золотая чаша", "темноволосый Посейдон"]
    ambiguities: ["Писистрат не знает, что первым передаёт чашу самой богине."]
    first_reveals: [peisistratus_hospitality, telemachus_public_speech_training]
    reader_questions:
      [
        "Почему сначала молятся?",
        "Кто такой Писистрат?",
        "Почему Телемах стесняется?",
      ]
  - lines: "63-85"
    event: "Нестор расспрашивает накормленных гостей, и Телемах открывает цель пути."
    speaker: "Нестор, Телемах"
    addressee: "гости; Нестор"
    cause_and_effect: "После обеспечения безопасности хозяин вправе выяснить происхождение гостя; Афина даёт Телемаху смелость назвать себя."
    formulas_and_epithets: ["конник Нестор", "гора Нерит", "стойкий Одиссей"]
    ambiguities:
      [
        "Вопрос о разбойниках не является прямым обвинением: это формульный перечень возможных целей мореплавателей.",
      ]
    first_reveals: [telemachus_names_himself_to_nestor]
    reader_questions:
      [
        "Почему имя спрашивают после еды?",
        "Разбой считался обычным?",
        "Что Нестор знает об Одиссее?",
      ]
  - lines: "86-119"
    event: "Телемах просит не скрывать смерть отца; Нестор начинает памятью о потерях под Троей."
    speaker: "Телемах, Нестор"
    addressee: "Нестор; Телемах"
    cause_and_effect: "Неопределённость тяжелее дурной вести; просьба юноши вызывает не короткий ответ, а рассказ свидетеля о целом поколении."
    formulas_and_epithets:
      ["волны Амфитриты", "город Приама", "подобный богам Патрокл"]
    ambiguities:
      [
        "Телемах предполагает гибель, но не знает её; комментарий не должен исправлять его из будущего.",
      ]
    first_reveals: [nestor_grieves_antilochus]
    reader_questions:
      [
        "Кто такая Амфитрита?",
        "Почему Телемах просит не жалеть его?",
        "Кто погиб под Троей?",
      ]
  - lines: "120-158"
    event: "Нестор сравнивает ум Телемаха с отцовским и рассказывает о ссоре Атридов."
    speaker: "Нестор"
    addressee: "Телемах и Афина-Ментор"
    cause_and_effect: "Падение Трои не завершает бедствий: нарушение порядка и гнев Афины раскалывают войско перед возвращением."
    formulas_and_epithets:
      ["божественный Одиссей", "сыновья Атрея", "широкое море"]
    ambiguities:
      [
        "Причина гнева Афины здесь названа общо; более подробное объяснение из других традиций не добавляется.",
