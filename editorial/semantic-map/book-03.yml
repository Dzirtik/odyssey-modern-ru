  - lines: "159-187"
    event: "Ахейцы расходятся; Одиссей возвращается к Агамемнону, а Нестор успешно достигает Пилоса."
    speaker: "Нестор"
    addressee: "Телемах"
    cause_and_effect: "Повторный раскол у Тенедоса отделяет путь Одиссея от пути Нестора, поэтому старец больше не может быть очевидцем его судьбы."
    formulas_and_epithets:
      ["богатое рыбой море", "громогласный Зевс", "жертва Посейдону"]
    ambiguities:
      [
        "Гадание у Лесбоса сообщает решение маршрута, но текст не описывает техническую процедуру знака.",
      ]
    first_reveals: [nestor_loses_track_of_odysseus]
    reader_questions:
      [
        "Где Тенедос и Лесбос?",
        "Почему Одиссей повернул назад?",
        "Как выбирали морской путь?",
      ]
  - lines: "188-222"
    event: "Нестор перечисляет известные возвращения и ставит Телемаху в пример Ореста."
    speaker: "Нестор, Телемах"
    addressee: "Телемах; Нестор"
    cause_and_effect: "Неполная хроника возвращений превращается в совет: судьба дома зависит и от действия оставшегося сына."
    formulas_and_epithets:
      ["сын Ахилла", "великая слава ахейцев", "будущие люди"]
    ambiguities:
      [
        "Пример Ореста — риторическое побуждение, а не заранее установленный сценарий Телемаха.",
