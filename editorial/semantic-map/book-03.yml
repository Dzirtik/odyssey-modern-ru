  - lines: "261-296"
    event: "Нестор рассказывает о соблазнении Клитемнестры, удалении певца и задержке Менелая у Суния."
    speaker: "Нестор"
    addressee: "Телемах"
    cause_and_effect: "Отсутствие Менелая оставляет убийцу без противника; устранение порученного певца снимает последнее препятствие в доме."
    formulas_and_epithets:
