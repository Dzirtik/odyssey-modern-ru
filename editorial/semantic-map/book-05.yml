book: 5
source_range: "5.1-493"
base_source_id: homer_odyssey_perseus_grc2
status: editorial_preview
segments:
  - lines: "1-21"
    event: "Афина ставит перед советом богов две угрозы: плен Одиссея и засаду Телемаху."
    speaker: "Афина"
    addressee: "Зевс и бессмертные"
    cause_and_effect: "Параллель отца и сына возвращает действие от Телемахии к главному герою."
    formulas_and_epithets:
      ["розовоперстая Заря", "скипетроносный царь", "мягок как отец"]
    ambiguities:
      [
        "Резкость Афины — риторический упрёк, а не отмена ценности справедливого царя.",
      ]
    first_reveals: [second_divine_council]
    reader_questions: ["Почему совет повторяется?", "Знают ли боги о засаде?"]
  - lines: "22-42"
    event: "Зевс поручает Афине спасти Телемаха, а Гермесу — передать решение Калипсо."
    speaker: "Зевс"
    addressee: "Афина, Гермес"
    cause_and_effect: "Божественное решение определяет пределы пути, но оставляет Одиссею самостоятельное страдание и действие."
    formulas_and_epithets:
      ["вестник Гермес", "крепко связанный плот", "близкие богам феаки"]
    ambiguities:
      [
        "Слушатель знает план подробнее героя; это не основание переносить знание в его мысли.",
      ]
    first_reveals: [odysseus_route_decreed]
    reader_questions: ["Кто такие феаки?", "Почему боги не перевозят его сами?"]
  - lines: "43-68"
    event: "Гермес летит к Огигии и приближается к пещере поющей и ткущей Калипсо."
    speaker: "повествователь"
    addressee: "слушатель"
    cause_and_effect: "Космическая скорость вестника подчёркивает удалённость острова от человеческих городов."
    formulas_and_epithets:
      ["золотые сандалии", "жезл сна", "баклан над волнами"]
    ambiguities:
      ["Сравнение с птицей описывает движение бога, не его превращение."]
    first_reveals: [calypso_home_seen]
    reader_questions: ["Где Огигия?", "Почему Калипсо ткёт?"]
  - lines: "69-91"
    event: "Райская природа острова противопоставлена плачущему на берегу Одиссею."
    speaker: "повествователь"
    addressee: "слушатель"
    cause_and_effect: "Красота, способная восхитить бога, не делает плен желанным для смертного."
    formulas_and_epithets:
      ["четыре источника", "фиалки и сельдерей", "влажные глаза"]
    ambiguities: ["Идиллический пейзаж и принуждение существуют одновременно."]
    first_reveals: [odysseus_appears_in_action]
    reader_questions: ["Почему Одиссей не в пещере?", "Может ли он уйти?"]
  - lines: "92-119"
    event: "Калипсо принимает Гермеса; он передаёт приказ Зевса освободить Одиссея."
    speaker: "Калипсо, Гермес"
    addressee: "друг другу"
    cause_and_effect: "Гостевой приём бога предшествует сообщению, которое ограничивает власть хозяйки."
    formulas_and_epithets:
      ["амброзия и нектар", "эгидодержавный Зевс", "город Приама"]
    ambiguities:
      [
        "Версия Гермеса о прежней буре формулируется кратко и не заменяет более поздний рассказ героя.",
      ]
    first_reveals: [hermes_orders_release]
    reader_questions:
      ["Почему Гермес летит неохотно?", "Может ли Калипсо отказаться?"]
  - lines: "120-147"
    event: "Калипсо обвиняет богов в двойном стандарте, но принимает приказ."
    speaker: "Калипсо, Гермес"
    addressee: "друг другу"
    cause_and_effect: "Примеры Зари и Деметры обосновывают протест; угроза гнева Зевса завершает спор."
    formulas_and_epithets:
      ["розовоперстая Заря", "трижды вспаханное поле", "молния Зевса"]
    ambiguities:
      [
        "Справедливость жалобы Калипсо не отменяет отсутствия согласия удерживаемого Одиссея.",
      ]
    first_reveals: [calypso_divine_double_standard]
    reader_questions:
      ["Кто Орион и Иасион?", "Почему богини не свободны в выборе?"]
  - lines: "148-170"
    event: "Калипсо сообщает пленнику об освобождении и предлагает построить плот."
    speaker: "повествователь, Калипсо"
    addressee: "слушатель, Одиссей"
    cause_and_effect: "Приказ богов становится практической задачей; отсутствие судна требует ремесленной работы героя."
    formulas_and_epithets:
      ["слёзы на берегу", "широкий настил", "попутный ветер"]
    ambiguities:
      [
        "Ночное принуждение названо прямо; красота острова не означает добровольного союза.",
      ]
    first_reveals: [calypso_announces_release]
    reader_questions:
      ["Почему Одиссей не верит?", "Что именно он должен построить?"]
  - lines: "171-191"
    event: "Одиссей требует клятву, и Калипсо клянётся Стиксом не вредить."
    speaker: "Одиссей, Калипсо"
    addressee: "друг другу"
    cause_and_effect: "Опыт угроз превращает подозрение в условие согласия; божественная клятва создаёт доверие."
    formulas_and_epithets: ["Земля и Небо", "воды Стикса", "не железное сердце"]
    ambiguities: ["Недоверие героя характеризует mētis, а не неблагодарность."]
    first_reveals: [calypso_styx_oath]
    reader_questions:
      ["Почему Стикс страшен богам?", "Может ли бог нарушить клятву?"]
  - lines: "192-226"
    event: "Калипсо предлагает бессмертие; Одиссей выбирает смертную жену, дом и возвращение."
    speaker: "Калипсо, Одиссей"
    addressee: "друг другу"
    cause_and_effect: "Спор отделяет красоту и вечную жизнь от принадлежности к собственному человеческому миру."
    formulas_and_epithets:
      ["сын Лаэрта", "вечно юная богиня", "сердце, привычное к бедам"]
    ambiguities:
      ["Последняя ночь не стирает описанного ранее неравенства власти."]
    first_reveals: [odysseus_rejects_immortality]
    reader_questions:
      ["Почему он предпочитает смертность?", "Как он отвечает без оскорбления?"]
  - lines: "227-261"
    event: "Одиссей за четыре дня строит морскую конструкцию из двадцати деревьев."
    speaker: "повествователь"
    addressee: "слушатель"
    cause_and_effect: "Инструменты Калипсо и мастерство героя превращают решение совета в материальный путь."
    formulas_and_epithets:
      ["двусторонний топор", "корабельный мастер", "мачта и рулевое весло"]
    ambiguities:
      [
        "schedia переводится как плот, хотя конструкция сложнее бытового образа плота.",
      ]
    first_reveals: [odysseus_builds_sailing_raft]
    reader_questions:
      ["Откуда Одиссей умеет строить?", "Почему двадцать деревьев?"]
  - lines: "262-286"
    event: "Одиссей выходит в море и семнадцать дней держит курс по звёздам."
    speaker: "повествователь"
    addressee: "слушатель"
    cause_and_effect: "Совет Калипсо и непрерывное бодрствование приводят к видимости земли феаков."
    formulas_and_epithets:
      ["Плеяды", "поздний Волопас", "Медведица, не входящая в Океан"]
    ambiguities:
      ["Астрономическое направление не локализует Огигию однозначно."]
    first_reveals: [odysseus_celestial_navigation]
    reader_questions: ["Почему Медведица слева?", "Как он не спит?"]
  - lines: "287-312"
    event: "Посейдон замечает героя и поднимает бурю всех ветров."
    speaker: "Посейдон, Одиссей, повествователь"
    addressee: "себе, слушатель"
    cause_and_effect: "Божественный план возвращения не лишает враждебного бога возможности причинить последнее страдание."
    formulas_and_epithets: ["землесотрясатель", "четыре ветра", "тело Ахилла"]
    ambiguities:
      [
        "Желание смерти под Троей связано с погребением и славой, не с отказом от дома вообще.",
      ]
    first_reveals: [poseidon_storm_scheria]
    reader_questions:
      ["Почему Посейдон не был на совете?", "Может ли он отменить судьбу?"]
  - lines: "313-337"
    event: "Волна ломает мачту и выбрасывает Одиссея; он возвращается на остатки плота."
    speaker: "повествователь"
    addressee: "слушатель"
    cause_and_effect: "Тяжёлая одежда и разрушение снастей превращают управляемое плавание в пассивный дрейф."
    formulas_and_epithets:
      ["горькая соль", "колючки по полю", "ветры играют плотом"]
    ambiguities:
      [
        "Сравнение с растением показывает сцепленность и беспомощность, не географическое время года.",
      ]
    first_reveals: [raft_disabled]
    reader_questions:
      ["Почему он возвращается на плот?", "Что случилось с парусом?"]
  - lines: "338-365"
    event: "Левкотея даёт покрывало и совет плыть; Одиссей откладывает исполнение."
    speaker: "Левкотея, Одиссей"
    addressee: "друг другу, себе"
    cause_and_effect: "Новая помощь сталкивается с оправданным недоверием; герой сохраняет обе возможности до разрушения плота."
    formulas_and_epithets:
      ["белая богиня", "морская птица", "божественное покрывало"]
    ambiguities: ["Локальная биография Ино не расширяется позднейшими мифами."]
    first_reveals: [leucothea_veil]
    reader_questions: ["Кто Ино?", "Почему Одиссей не слушается сразу?"]
  - lines: "366-387"
    event: "Последняя волна разбивает плот; Одиссей использует покрывало, Афина усмиряет ветры."
    speaker: "Посейдон, повествователь"
    addressee: "Одиссей, слушатель"
    cause_and_effect: "Исчезновение материальной опоры делает совет Левкотеи единственным; вмешательство Афины открывает путь вплавь."
    formulas_and_epithets:
      ["бревно как конь", "дворец в Эгах", "северный ветер"]
    ambiguities:
      ["Действия Посейдона и Афины сосуществуют без прямого боя богов."]
    first_reveals: [raft_destroyed, athena_calms_winds]
    reader_questions:
      ["Почему остаётся северный ветер?", "Куда уезжает Посейдон?"]
  - lines: "388-414"
    event: "После двух суток вплавь Одиссей видит берег, но обнаруживает только скалы."
    speaker: "повествователь, Одиссей"
    addressee: "слушатель, себе"
    cause_and_effect: "Надежда на землю сменяется новой задачей — найти физически доступный выход."
    formulas_and_epithets:
      ["выздоровевший отец", "третий день", "грохот прибоя"]
    ambiguities:
      [
        "Обратное сравнение переносит радость детей на радость героя и не сообщает новую биографию.",
      ]
    first_reveals: [odysseus_reaches_rocky_scheria]
    reader_questions: ["Почему берег опаснее моря?", "Где гавань?"]
  - lines: "415-450"
    event: "Одиссей травмирует руки о скалу, находит устье и просит речного бога о защите."
    speaker: "Одиссей, повествователь"
    addressee: "себе, речной бог, слушатель"
    cause_and_effect: "Неудача прямого выхода ведёт к поиску пологого устья; молитва меняет течение."
    formulas_and_epithets:
      ["присоски осьминога", "серые воды", "священный проситель"]
    ambiguities:
      ["Имя реки не дано, и конкретная локализация остаётся спекулятивной."]
    first_reveals: [odysseus_prays_unknown_river]
    reader_questions: ["Почему проситель священен?", "Как река отвечает?"]
  - lines: "451-472"
    event: "Река выносит Одиссея; он возвращает покрывало и целует землю."
    speaker: "повествователь"
    addressee: "слушатель"
    cause_and_effect: "Исполненная молитва завершает морскую угрозу, но оставляет героя истощённым и без укрытия."
    formulas_and_epithets:
      ["гладкое устье", "земля, дающая хлеб", "покрывало в море"]
    ambiguities:
      [
        "Поцелуй земли выражает достижение суши, а не узнавание конкретной страны.",
      ]
    first_reveals: [odysseus_lands_scheria]
    reader_questions: ["Почему нужно отвернуться?", "Может ли он идти?"]
  - lines: "473-493"
    event: "Одиссей выбирает чащу, укрывается листьями, а Афина погружает его в сон."
    speaker: "Одиссей, повествователь"
    addressee: "себе, слушатель"
    cause_and_effect: "Последнее рассуждение о рисках приводит к укрытию, где сохранённая жизнь уподоблена тлеющей головне."
    formulas_and_epithets:
      ["маслина и колючий куст", "головня под золой", "сон от Афины"]
    ambiguities:
      [
        "Огненное сравнение означает сохранение жизни, не реальный огонь в листьях.",
      ]
    first_reveals: [odysseus_sleeps_under_leaves]
    reader_questions:
      ["Почему он не остаётся у реки?", "Что означает сравнение с головнёй?"]
