schema: 1
book: 1
model: gpt-4o-mini-tts
title: "Песнь I"
voices:
  narrator:
    voice: cedar
    label: Рассказчик
    instructions: >-
      Говори только по-русски. Спокойный, ясный, литературный рассказчик
      большой эпической аудиокниги. Естественная русская просодия, сдержанное
      достоинство, средний темп, точные ударения, без театрального пафоса.
  zeus:
    voice: onyx
    label: Зевс
    instructions: >-
      Говори только по-русски. Голос Зевса: низкий, зрелый, властный, но не
      карикатурный. Размеренный темп, ясная дикция и спокойная сила.
  athena:
    voice: marin
    label: Афина
    instructions: >-
      Говори только по-русски. Голос Афины: взрослый, ясный, умный и уверенный.
      Передавай сдержанное сочувствие и решимость без мелодрамы.
  telemachus:
    voice: ash
    label: Телемах
    instructions: >-
      Говори только по-русски. Голос Телемаха: молодой взрослый мужчина,
      вдумчивый и благородный. В начале слышна неуверенность, затем растущая
      решимость; без подростковой карикатуры.
  penelope:
    voice: coral
    label: Пенелопа
    instructions: >-
      Говори только по-русски. Голос Пенелопы: зрелый, мягкий и достойный.
      Сдержанное горе без рыданий и мелодраматического нажима.
  antinous:
    voice: echo
    label: Антиной
    instructions: >-
      Говори только по-русски. Голос Антиноя: взрослый, самоуверенный и
      насмешливый, с холодной угрозой под внешней учтивостью.
  eurymachus:
    voice: verse
    label: Евримах
    instructions: >-
      Говори только по-русски. Голос Евримаха: взрослый, гладкий и
      дипломатичный, но неискренний; ясная дикция и умеренный темп.
