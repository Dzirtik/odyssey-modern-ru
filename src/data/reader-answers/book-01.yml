  question: Кто такие Эгисф, Агамемнон и Орест?
  summary: Эгисф — Захватил жену Агамемнона и убил вернувшегося царя вопреки
    предупреждению Гермеса; затем погиб от Ореста. Агамемнон — Предводитель
    ахейцев под Троей и брат Менелая; его возвращение становится тревожной
    параллелью истории Одиссея. Орест — Сын Агамемнона, отомстивший Эгисфу; для
    Телемаха он служит примером действия сына в отсутствие отца.
  details: "Так поступил Эгисф: он взял законную жену Агамемнона и убил царя,
    когда тот вернулся с войны. Зевс связывает гибель Эгисфа с его собственным
    поступком вопреки предупреждению Гермеса. Важно сохранить оговорку этого
    места: География эфиопов является частью мира поэмы и не получает уверенной
    современной локализации. Соотношение божественной доли и человеческой
