- term: Ахейцы
  first_book: 1
  greek: Achaioi
  category: народы и имена
  definition: Одно из собирательных названий греков у Гомера; рядом употребляются «данайцы» и «аргивяне».
- term: Аргивяне и данайцы
  first_book: 1
  greek: Argeioi; Danaoi
  category: народы и имена
  definition: Другие эпические обозначения греческого войска; они не обязательно указывают только на жителей города Аргос.
- term: Басилевс
  first_book: 1
  greek: basileus
  category: общество и власть
  definition: Властитель или знатный предводитель; в одной общине могут одновременно существовать несколько басилевсов.
- term: Анакс
  first_book: 1
  greek: anax
  category: общество и власть
  definition: Высокий титул владыки, применяемый к богам и выдающимся правителям; не является простым синонимом современного монарха.
- term: Ойкос
  first_book: 1
  greek: oikos
  category: общество и власть
  definition: Дом как здание, семья, имущество, зависимые люди и продолжение рода одновременно.
- term: Ксения
  first_book: 1
  greek: xenia
  category: общество и власть
  definition: Долговременная связь гостеприимства между домами, предполагающая приём, защиту, дары и взаимные обязательства.
- term: Клеос
  first_book: 1
  greek: kleos
  category: эпос и рассказ
  definition: Сохраняемая обществом слава и память о поступках, особенно та, которую передаёт песня.
- term: Ностос
  first_book: 1
  greek: nostos
  category: эпос и рассказ
  definition: Возвращение героя из войны домой и одновременно традиционный сюжет о таком возвращении.
- term: Аэд
  first_book: 1
  greek: aoidos
  category: эпос и рассказ
  definition: Профессиональный певец и создатель исполняемой песни; у Гомера это Фемий и Демодок.
- term: Форминга
  first_book: 1
  greek: phorminx
  category: вещи и быт
  definition: Струнный инструмент, которым певец сопровождает эпическое исполнение; точная конструкция могла различаться.
- term: Эпитет
  first_book: 1
  greek: epitheton
  category: эпос и рассказ
  definition: Повторяемое определение персонажа или предмета, например «сероглазая Афина»; оно работает в формульной системе стиха.
- term: Муза
  first_book: 1
  greek: Mousa
  category: эпос и рассказ
  definition: Богиня поэтического знания, к которой повествователь обращается как к источнику песни.
- term: Проситель
  first_book: 1
  greek: hiketes
  category: общество и власть
  definition: Человек, ритуально ищущий защиты у более сильного, часто касаясь его колен или домашнего очага.
- term: Возлияние
  first_book: 1
  greek: sponde
  category: религия и ритуал
  definition: Ритуальное выливание части напитка в честь богов перед питьём, молитвой или завершением пира.
- term: Жертвоприношение
  first_book: 1
  greek: thysia
  category: религия и ритуал
  definition: Упорядоченное подношение богам, включающее молитву, выделение божественной доли и общую трапезу участников.
- term: Рабство и зависимый труд
  first_book: 1
  greek: dmos; dmoe
  category: общество и власть
  definition: Хозяйство героев основано на несвободном труде купленных, захваченных или рождённых в доме людей; близость к семье не отменяет принуждения.
- term: Талант
  first_book: 1
  greek: talanton
  category: вещи и быт
  definition: Весовая мера ценного металла, а не монета с фиксированной современной стоимостью.
- term: Агора
  first_book: 2
  greek: agora
  category: общество и власть
  definition: Место общего собрания и само собрание свободных мужчин общины.
- term: Фемида
  first_book: 2
  greek: themis
  category: общество и власть
  definition: Установленный богами и обычаем должный порядок; слово нельзя полностью свести к писаному закону.
- term: Скипетр
  first_book: 2
  greek: skeptron
  category: общество и власть
  definition: Жезл власти и знак права говорить перед собранием, передаваемый между выступающими.
- term: Знамение
  first_book: 2
  greek: sema; oionos
  category: религия и ритуал
  definition: Событие, особенно полёт птиц или гром, которое персонажи истолковывают как сообщение богов; толкование может быть спорным.
- term: Глашатай
  first_book: 2
  greek: keryx
  category: общество и власть
  definition: Публичный служитель, созывающий собрания, передающий жезл, распоряжающийся пиром и сопровождающий посольства.
- term: Гекатомба
  first_book: 3
  greek: hekatombe
  category: религия и ритуал
  definition: Крупное общественное жертвоприношение; эпическое употребление не всегда означает буквально сто животных.
- term: Кратер
  first_book: 3
  greek: krater
  category: вещи и быт
  definition: Большая чаша, в которой вино смешивали с водой перед разливанием по кубкам.
- term: Асаминт
  first_book: 3
  greek: asaminthos
  category: вещи и быт
  definition: Ванна или купальный сосуд; археологические параллели помогают представить предмет, но не доказывают историчность сцены.
- term: Электр
  first_book: 4
  greek: elektron
  category: вещи и быт
  definition: Сияющий материал в описании дворца Менелая; слово могло обозначать янтарь либо светлый сплав золота и серебра.
- term: Непенф
  first_book: 4
  greek: nepenthes
  category: вещи и быт
  definition: Название средства Елены, подавляющего скорбь; точная ботаническая или фармакологическая идентификация невозможна.
- term: Елисейская равнина
  first_book: 4
  greek: Elysion pedion
  category: мир поэмы
  definition: Далёкое место облегчённой посмертной или особой жизни, куда боги могут перенести избранного человека.
- term: Амброзия и нектар
  first_book: 5
  greek: ambrosia; nektar
  category: мир поэмы
  definition: Пища, питьё и иногда ароматическое средство бессмертных; функции слов меняются по контексту.
- term: Феаки
  first_book: 5
  greek: Phaiekes
  category: народы и имена
  definition: Близкий богам народ искусных мореходов, живущий на Схерии и обеспечивающий безопасное возвращение гостя.
- term: Мегарон
  first_book: 6
  greek: megaron
  category: вещи и быт
  definition: Главный зал большого дома, где принимают гостей, пируют, совещаются и совершаются ключевые публичные действия.
- term: Хитон и плащ
  first_book: 6
  greek: chiton; chlaina
  category: вещи и быт
  definition: Основная нательная одежда и верхнее шерстяное покрытие; русские привычные слова лишь приблизительно передают древние формы.
- term: Треножник
  first_book: 8
  greek: tripous
  category: вещи и быт
  definition: Ценный трёхногий сосуд или подставка, используемая в хозяйстве, культе и обмене престижными дарами.
- term: Циклопы
  first_book: 1
  greek: Kyklopes
  category: народы и существа
  definition: В «Одиссее» — отдельный народ могучих одноглазых пастухов без общих собраний; нормативный вариант «киклопы» ближе к греческому произношению.
- term: Киконы
  first_book: 9
  greek: Kikones
  category: народы и существа
  definition: Народ фракийского побережья, чей город Исмар люди Одиссея разграбили после отплытия от Трои.
- term: Лотофаги
  first_book: 9
  greek: Lotophagoi
  category: народы и существа
  definition: «Едящие лотос» жители, чья пища лишает путника желания возвращаться домой; ботанический вид растения не установлен.
- term: Метис
  first_book: 9
  greek: metis
  category: эпос и рассказ
  definition: Практический, гибкий и часто обманный ум, позволяющий действовать в меняющихся обстоятельствах.
- term: Гибрис
  first_book: 9
  greek: hybris
  category: общество и власть
  definition: Насильственная самоуверенность и нарушение границ другого; это не просто внутреннее чувство гордости.
- term: Моли
  first_book: 10
  greek: moly
  category: мир поэмы
  definition: Таинственное растение, которое Гермес даёт Одиссею как защиту от действия Кирки; реальный ботанический вид не определён.
- term: Психе
  first_book: 11
  greek: psyche
  category: мир поэмы
  definition: Отделившаяся от тела тень или жизненное начало умершего; гомеровское значение не совпадает полностью с поздней идеей бессмертной души.
- term: Некия
  first_book: 11
  greek: nekuia
  category: эпос и рассказ
  definition: Обряд вызова и расспроса мёртвых; Одиссей стоит у границы мира умерших, а не совершает обычное путешествие по его владениям.
- term: Аид и Эреб
  first_book: 11
  greek: Hades; Erebos
  category: мир поэмы
  definition: Аид может обозначать бога и область мёртвых, Эреб — её тёмную глубину или мрак; поэтическая география не образует единой карты.
- term: Сирены
  first_book: 12
  greek: Seirenes
  category: народы и существа
  definition: Существа, чья песня обещает знание и удерживает слушателя до гибели; поэма не даёт привычного позднего описания их внешности.
- term: Скилла
  first_book: 12
  greek: Skylla
  category: народы и существа
  definition: Многоголовое морское чудовище в скале, от которого невозможно защитить весь корабль без потерь.
- term: Харибда
  first_book: 12
  greek: Charybdis
  category: народы и существа
  definition: Морская сила, периодически втягивающая и извергающая воду; вместе со Скиллой образует выбор между разными опасностями.
- term: Табу
  first_book: 12
  greek: ""
  category: современное пояснение
  definition: Современное слово для безусловного запрета; в поэме запрет на стада Гелиоса основан на божественной собственности и прямом предупреждении.
- term: Узнавание
  first_book: 13
  greek: anagnorisis
  category: эпос и рассказ
  definition: Установление личности через рассказ, телесный знак, вещь, действие или общее тайное знание; разные сцены требуют разных доказательств.
- term: Ксенос
  first_book: 14
  greek: xenos
  category: общество и власть
  definition: Чужеземец, гость или гостевой друг; значение определяется отношением между людьми, а не только происхождением.
- term: Талисманный шрам
  first_book: 19
  greek: oule
  category: эпос и рассказ
  definition: Старый рубец Одиссея служит телесным свидетельством личности, но узнавание зависит также от того, кто и при каких обстоятельствах его видит.
- term: Лук Одиссея
  first_book: 21
  greek: toxon
  category: вещи и быт
  definition: Составной знак силы, памяти и нарушенного гостеприимства; состязание проверяет не только физическую мощь, но и право распоряжаться домом.
- term: Погребальный обряд
  first_book: 24
  greek: taphos
  category: религия и ритуал
  definition: Оплакивание, сожжение или погребение, насыпь и память завершают обязанности живых перед умершим и закрепляют его общественный статус.
